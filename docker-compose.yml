services:
  photobook:
    image: ghcr.io/florentvotte/photos:latest
    container_name: photobook
    restart: unless-stopped
    networks:
      - caddy-net
    environment:
      - NODE_ENV=production
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://photos.votte.eu}
      - SYNC_WEBHOOK_SECRET=${SYNC_WEBHOOK_SECRET:-}
      - ADOBE_CLIENT_ID=${ADOBE_CLIENT_ID:-}
      - ADOBE_CLIENT_SECRET=${ADOBE_CLIENT_SECRET:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
    volumes:
      - ./data:/app/data
      - ./data/photos:/app/public/photos
      - ./portrait.jpg:/app/public/portrait.jpg:ro
    healthcheck:
      # 127.0.0.1, NOT localhost. Inside this container `localhost` resolves to
      # the IPv6 address ::1 (musl returns the ::1 entry from /etc/hosts first),
      # while Next.js binds IPv4 only — see `ENV HOSTNAME="0.0.0.0"` in the
      # Dockerfile, which is deliberate. So a probe asking for `localhost` was
      # refused every 30s and the container reported `unhealthy` continuously,
      # with a failing streak past 650, while photos.votte.eu served fine the
      # whole time — Caddy reaches the container over caddy-net, never through
      # localhost, so the serving path and the probe path are different.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  caddy-net:
    external: true
    name: caddy-net
